<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Full-Stack to AI-Architect — structured course lesson"
    />

    <title>Lesson — Full-Stack to AI-Architect</title>

    <!-- ── FOUC Prevention: apply theme before paint ── -->
    <script src="js/theme.js"></script>

    <!-- ── Preconnect hints ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Syntax highlighting CSS (always dark — code blocks are always dark) ── -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark-dimmed.min.css"
      crossorigin="anonymous"
    />

    <!-- ── Site CSS ── -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>

  <body>
    <!-- ════════════════════════════════════════════════════════════
       READING PROGRESS BAR (fills on scroll)
       ════════════════════════════════════════════════════════════ -->
    <div
      id="progress-bar"
      role="progressbar"
      aria-valuenow="0"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-label="Reading progress"
    ></div>

    <!-- ════════════════════════════════════════════════════════════
       SITE HEADER
       ════════════════════════════════════════════════════════════ -->
    <header class="site-header" role="banner">
      <!-- Left: hamburger + logo -->
      <div class="header-left">
        <button
          id="sidebar-toggle"
          class="sidebar-toggle"
          aria-label="Toggle sidebar"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <a
          href="index.html"
          class="site-logo"
          aria-label="Full-Stack to AI-Architect — home"
        >
          <div class="site-logo-icon" aria-hidden="true">F→A</div>
          <span>Full-Stack to AI-Architect</span>
        </a>
      </div>

      <!-- Center: breadcrumb -->
      <nav class="header-center" aria-label="Breadcrumb">
        <div class="breadcrumb">
          <span id="breadcrumb-chapter" class="breadcrumb-chapter">—</span>
          <span class="breadcrumb-sep" aria-hidden="true">›</span>
          <span id="breadcrumb-lesson" class="breadcrumb-lesson">Loading…</span>
        </div>
      </nav>

      <!-- Right: theme toggle -->
      <div class="header-right">
        <button
          id="theme-toggle"
          class="theme-toggle"
          title="Toggle dark/light mode"
        >
          <!-- Sun icon (shown in dark mode) -->
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <line x1="12" y1="2" x2="12" y2="4" />
            <line x1="12" y1="20" x2="12" y2="22" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="2" y1="12" x2="4" y2="12" />
            <line x1="20" y1="12" x2="22" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <span class="sr-only">Toggle dark mode</span>
        </button>
      </div>
    </header>

    <!-- ════════════════════════════════════════════════════════════
       PAGE SHELL
       ════════════════════════════════════════════════════════════ -->
    <div class="page-shell">
      <!-- ── Mobile overlay (closes sidebar on tap outside) ── -->
      <div
        id="sidebar-overlay"
        class="sidebar-overlay"
        aria-hidden="true"
      ></div>

      <!-- ══════════════════════════════════════════════════════
         SIDEBAR (left, fixed)
         ══════════════════════════════════════════════════════ -->
      <aside id="sidebar" class="sidebar" aria-label="Course navigation">
        <nav class="sidebar-inner" aria-label="Lessons">
          <div id="sidebar-nav">
            <!-- Populated by sidebar.js -->
            <div
              style="
                padding: 2rem 1.25rem;
                color: var(--color-text-faint);
                font-size: 0.8125rem;
              "
            >
              Loading curriculum…
            </div>
          </div>
        </nav>
      </aside>

      <!-- ══════════════════════════════════════════════════════
         MAIN CONTENT
         ══════════════════════════════════════════════════════ -->
      <main class="main-content" id="main-content">
        <div class="content-wrapper">
          <!-- ── Lesson article ── -->
          <article
            class="lesson-article"
            aria-live="polite"
            aria-label="Lesson content"
          >
            <!-- Lesson content (injected by lesson.js) -->
            <div id="lesson-content">
              <div class="lesson-loading">
                <div class="spinner"></div>
                <p>Loading lesson…</p>
              </div>
            </div>

            <!-- Page nav (prev / next) — populated by lesson.js -->
            <nav
              id="page-nav"
              class="page-nav"
              aria-label="Lesson navigation"
            ></nav>
          </article>
        </div>
      </main>
    </div>
    <!-- /.page-shell -->

    <!-- ════════════════════════════════════════════════════════════
       SCRIPTS
       Load order matters:
       1. marked.js   — markdown → HTML
       2. highlight.js — syntax coloring
       3. Site modules (order: theme already ran inline)
       ════════════════════════════════════════════════════════════ -->

    <!-- marked.js — Markdown parser -->
    <script
      src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- highlight.js — Syntax highlighting -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Site JS modules -->
    <script src="js/progress.js"></script>
    <script src="js/code.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/lesson.js"></script>
  </body>
</html>
